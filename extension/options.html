<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your reading schedule · X Brief</title>
    <link rel="stylesheet" href="ui.css" />
    <script src="options.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Reading schedule</h1>
      <div class="layout">
        <form id="schedule">
          <div class="field">
            <label for="times">When do you want to read?</label
            ><input
              id="times"
              name="times"
              required
              placeholder="09:00, 18:00"
              autocomplete="off"
            />
            <p class="hint">Local time, separated by commas.</p>
          </div>
          <div class="field">
            <label for="windowMinutes">Time to start a session</label
            ><input
              type="number"
              id="windowMinutes"
              min="10"
              max="180"
              required
            />
            <p class="hint">
              Minutes after each scheduled time. Unused sessions don’t
              accumulate.
            </p>
          </div>
          <div class="pair">
            <div class="field">
              <label for="maxPosts">Maximum posts</label
              ><input type="number" id="maxPosts" min="5" max="20" required />
            </div>
            <div class="field">
              <label for="activeMinutes">Reading minutes</label
              ><input
                type="number"
                id="activeMinutes"
                min="1"
                max="30"
                required
              />
            </div>
          </div>
          <button type="submit">Save reading schedule</button>
          <p class="status" id="status" role="status"></p>
        </form>
        <aside>
          <p>After your first edition, schedule changes apply tomorrow.</p>
          <p>Refreshing or opening another tab keeps the same edition.</p>
          <p>Settings and kept posts stay in this browser.</p>
        </aside>
      </div>
      <section class="rule" id="shelf">
        <h2>Kept posts</h2>
        <div id="kept" class="kept"></div>
      </section>
    </main>
  </body>
</html>
